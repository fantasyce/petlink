server {
    listen 8443 ssl;
    server_name api.fantasyce.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/api.fantasyce.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fantasyce.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:PetLinkTLS:1m;
    ssl_session_timeout 10m;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    if ($petlink_cloudflare_origin = 0) { return 403; }
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/petlink-access.log petlink_private;
    # Built-in error messages can include query strings. Access status and backend
    # event logs provide diagnostics without retaining those request values.
    error_log /dev/null;
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    location = /petlink { return 308 /petlink/; }
    location ^~ /petlink/ {
        limit_except GET POST PATCH { deny all; }
        limit_req zone=petlink_domain_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn petlink_domain_connections 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:18746/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $petlink_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @petlink_unavailable;
    }
    location @petlink_unavailable {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE"}';
    }
    location / { return 404; }
}
